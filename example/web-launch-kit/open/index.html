<body class="launch">
<div class="wrap">
    <div class="launcher">
        <div class="app">
            <img class="app-icon" id="open-icon" alt="" hidden>
            <div class="app-name" id="open-name"></div>
        </div>
        <p class="guide" id="open-guide" hidden></p>
        <div class="cta" id="open-cta" hidden>
            <button type="button" id="open-run"></button>
        </div>
    </div>
</div>

<script>
    function boot() {
        var LocaleKit = window.LocaleKit['default'];
        var PlatformKit = window.PlatformKit['default'];
        var LaunchKit = window.LaunchKit['default'];
        var icon = document.getElementById('open-icon');
        var name = document.getElementById('open-name');
        var guide = document.getElementById('open-guide');
        var cta = document.getElementById('open-cta');
        var run = document.getElementById('open-run');
        var payload = readOpenPayload(location);
        var os = PlatformKit.os.name;
        var info = payload === null ? null : payload[os];

        if (!info || typeof info !== 'object') {
            document.body.hidden = true;

            return;
        }

        var strings = resolveStrings(LocaleKit);

        document.documentElement.dir = LocaleKit.rtl ? 'rtl' : 'ltr';
        run.textContent = strings.openApp;
        guide.textContent = strings.guide;

        function reveal() {
            if (document.visibilityState === 'hidden') return;

            guide.hidden = false;
            cta.hidden = false;
        }

        function launch() {
            LaunchKit.app(payload).then(reveal, reveal);
        }

        run.addEventListener('click', launch);

        loadIdentity(LocaleKit, info, os, function (identity) {
            if (identity === null) return;

            if (identity.name) {
                name.textContent = identity.name;
                run.textContent = strings.open.replace('{app}', identity.name);
            }

            if (identity.logo) {
                icon.onload = function () {
                    icon.hidden = false;
                };
                icon.onerror = function () {
                    icon.onerror = null;

                    if (identity.spare) icon.src = identity.spare;
                };
                icon.src = identity.logo;
            }
        });

        launch();
    }

    var STORE_API = 'https://store-scrapper.onrender.com';
    var OPEN_STRINGS = {};

    (function () {
        function put(tags, guide, open, openApp) {
            for (var i = 0; i < tags.length; i++) {
                OPEN_STRINGS[tags[i]] = {guide: guide, open: open, openApp: openApp};
            }
        }

        put(['en'],
            'The app did not open on its own. Tap below to continue.',
            'Open {app}',
            'Open the app');
        put(['ko'],
            '앱이 자동으로 열리지 않았습니다. 아래를 눌러 계속하세요.',
            '{app} 열기',
            '앱 열기');
        put(['ja'],
            'アプリが自動で開きませんでした。下をタップして続けてください。',
            '{app} を開く',
            'アプリを開く');
        put(['zh'],
            '应用未能自动打开。点击下方继续。',
            '打开 {app}',
            '打开应用');
        put(['zh-Hant', 'zh-TW', 'zh-HK'],
            '應用程式未能自動開啟。請點擊下方繼續。',
            '開啟 {app}',
            '開啟應用程式');
        put(['es'],
            'La aplicación no se abrió automáticamente. Toca abajo para continuar.',
            'Abrir {app}',
            'Abrir la aplicación');
        put(['pt'],
            'O aplicativo não abriu automaticamente. Toque abaixo para continuar.',
            'Abrir {app}',
            'Abrir o aplicativo');
        put(['fr'],
            "L'application ne s'est pas ouverte automatiquement. Appuyez ci-dessous pour continuer.",
            'Ouvrir {app}',
            "Ouvrir l'application");
        put(['de'],
            'Die App wurde nicht automatisch geöffnet. Tippe unten, um fortzufahren.',
            '{app} öffnen',
            'App öffnen');
        put(['ru'],
            'Приложение не открылось автоматически. Нажмите ниже, чтобы продолжить.',
            'Открыть {app}',
            'Открыть приложение');
        put(['ar'],
            'لم يتم فتح التطبيق تلقائيًا. اضغط أدناه للمتابعة.',
            'فتح {app}',
            'فتح التطبيق');
    })();

    function resolveStrings(LocaleKit) {
        var supported = [];
        var key;

        for (key in OPEN_STRINGS) {
            if (Object.prototype.hasOwnProperty.call(OPEN_STRINGS, key)) supported.push(key);
        }

        return OPEN_STRINGS[LocaleKit.lookup(supported, 'en')] || OPEN_STRINGS['en'];
    }

    function storeQuery(info, os) {
        var ids = [];

        if (os === 'android') {
            if (info.packageName) ids.push('package_name=' + encodeURIComponent(info.packageName));

            return ids.length === 0 ? null : {path: 'play-store', ids: ids};
        }

        if (os === 'ios' || os === 'macos') {
            if (info.trackId) ids.push('track_id=' + encodeURIComponent(info.trackId));
            if (info.bundleId) ids.push('bundle_id=' + encodeURIComponent(info.bundleId));

            return ids.length === 0 ? null : {path: 'app-store', ids: ids};
        }

        if (os === 'windows') {
            if (info.productId) ids.push('product_id=' + encodeURIComponent(info.productId));

            if (info.packageFamilyName) {
                ids.push('package_family_name=' + encodeURIComponent(info.packageFamilyName));
            }

            return ids.length === 0 ? null : {path: 'microsoft-store', ids: ids};
        }

        return null;
    }

    function fallbackIdentity(info) {
        if (!info || typeof info.fallback !== 'string') return null;
        if (!/^https?:\/\//i.test(info.fallback)) return null;

        var host = info.fallback.replace(/^https?:\/\//i, '').split(/[\/?#]/)[0];

        if (host === '') return null;

        return {
            name: host.replace(/^www\./i, ''),
            logo: 'https://' + host + '/favicon.ico',
            spare: 'https://www.google.com/s2/favicons?sz=128&domain=' + encodeURIComponent(host)
        };
    }

    function loadIdentity(LocaleKit, info, os, done) {
        var query = storeQuery(info, os);

        function fromFallback() {
            done(fallbackIdentity(info));
        }

        if (query === null) return fromFallback();

        var subtags = LocaleKit.subtags;
        var language = subtags !== null && subtags.language ? subtags.language : 'en';
        var region = subtags !== null && subtags.region ? subtags.region.toLowerCase() : 'us';
        var url = STORE_API + '/' + query.path
            + '?lang=' + encodeURIComponent(language)
            + '&country=' + encodeURIComponent(region)
            + '&' + query.ids.join('&');
        var request = new XMLHttpRequest();

        request.open('GET', url, true);

        request.onreadystatechange = function () {
            if (request.readyState !== 4) return;

            if (request.status < 200 || request.status >= 300) return fromFallback();

            var body = null;

            try {
                body = JSON.parse(request.responseText);
            } catch (error) {
                return fromFallback();
            }

            if (body === null || (!body.name && !body.logo)) return fromFallback();

            done({name: body.name, logo: body.logo, spare: null});
        };

        request.onerror = fromFallback;
        request.send();
    }

    function decodeOpenPayload(encoded) {
        try {
            var text = encoded.replace(/-/g, '+').replace(/_/g, '/');

            while (text.length % 4 !== 0) text = text + '=';

            var binary = window.atob(text);
            var escaped = '';

            for (var i = 0; i < binary.length; i++) {
                escaped = escaped + '%' + ('0' + binary.charCodeAt(i).toString(16)).slice(-2);
            }

            var value = JSON.parse(decodeURIComponent(escaped));

            return value !== null && typeof value === 'object' ? value : null;
        } catch (error) {
            return null;
        }
    }

    function readOpenPayload(where) {
        var source = where.hash.replace(/^#/, '');

        if (source === '') {
            var match = /\/open\/([A-Za-z0-9_-]+)\/?$/.exec(where.pathname);

            source = match === null ? '' : match[1];
        }

        if (source === '') return null;

        return decodeOpenPayload(decodeURIComponent(source));
    }

    boot();
